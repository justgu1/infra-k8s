apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.0.2

    helm:
      values: |
        service:
          type: LoadBalancer

        ports:
          web:
            port: 80
            exposedPort: 80

          websecure:
            port: 443
            exposedPort: 443

        providers:
          kubernetesCRD:
            enabled: true

          kubernetesIngress:
            enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: infrastructure

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true