apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: traefik
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  project: default

  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.0.2

    helm:
      values: |
        deployment:
          enabled: true
          replicas: 1

        service:
          enabled: true
          spec:
            type: LoadBalancer

        ingressClass:
          enabled: true
          isDefaultClass: true

        providers:
          kubernetesCRD:
            enabled: true
            allowCrossNamespace: true

          kubernetesIngress:
            enabled: true

        ports:
          # redirect nativo na entryPoint: não intercepta o challenge ACME
          # (um Middleware por IngressRoute pega até o /.well-known/acme-challenge e quebra a emissão do cert)
          web:
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true

          # postgres: TCP passthrough pro shared/postgresql, mesmo IP do LoadBalancer (sem gastar IP novo do MetalLB)
          postgres:
            port: 5432
            expose:
              default: true
            exposedPort: 5432
            protocol: TCP

          # ingestão OTLP/gRPC externa (otel.justgui.dev:4317), TLS terminado aqui
          otlpgrpc:
            port: 4317
            expose:
              default: true
            exposedPort: 4317
            protocol: TCP

        accessLog:
          enabled: true

        # basicAuth das UIs de telemetria (prometheus, alertmanager) é Middleware
        # CRD do traefik (telemetry/telemetry-basicauth.yaml), lido direto do
        # Secret via API — não precisa montar volume no pod do traefik.

        api:
          dashboard: true
          insecure: false

        persistence:
          enabled: true
          path: /data
          size: 1Gi

        additionalArguments:
          - "--log.level=INFO"
          - "--certificatesresolvers.letsencrypt.acme.storage=/data/acme.json"
          - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
          - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
          - "--certificatesresolvers.letsencrypt.acme.email=szguisantos@gmail.com"

  destination:
    server: https://kubernetes.default.svc
    namespace: infrastructure

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true