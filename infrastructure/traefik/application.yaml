apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  project: default

  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.0.2

    helm:
      values: |
        deployment:
          enabled: true
          replicas: 1

        service:
          enabled: true
          type: ClusterIP

        ports:
          web:
            port: 8000
            exposedPort: 80
            hostPort: 80
            protocol: TCP

          websecure:
            port: 8443
            exposedPort: 443
            hostPort: 443
            protocol: TCP

        ingressClass:
          enabled: true
          isDefaultClass: true

        providers:
          kubernetesCRD:
            enabled: true
            allowCrossNamespace: true

          kubernetesIngress:
            enabled: true

        logs:
          general:
            level: INFO

        accessLog:
          enabled: true

        api:
          dashboard: true
          insecure: false

        persistence:
          enabled: true
          path: /data
          size: 1Gi

        additionalArguments:
          - "--certificatesresolvers.letsencrypt.acme.storage=/data/acme.json"
          - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
          - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"

  destination:
    server: https://kubernetes.default.svc
    namespace: infrastructure

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true