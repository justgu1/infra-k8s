# O endereço real do pool NÃO fica aqui (repo público). Ele vem do Secret
# decriptado pelo sealed-secrets a partir de sealed-secret.yaml, e é
# aplicado por cima deste placeholder pelo Job em job.yaml (hook PostSync).
# A Application (config-application.yaml) ignora diffs em spec.addresses
# pra o self-heal do ArgoCD não reverter o valor real pro placeholder.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: default-pool
  namespace: infrastructure
spec:
  addresses:
    - 203.0.113.1/32  # placeholder (TEST-NET-3, RFC 5737) — substituído em runtime
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default
  namespace: infrastructure
spec:
  ipAddressPools:
    - default-pool
