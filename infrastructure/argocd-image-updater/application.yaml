apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: argocd-image-updater
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  project: default

  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: 1.2.4

    helm:
      values: |
        # detecta digest novo em cada :latest e atualiza a Application direto
        # (write-back-method: argocd, default) — sem precisar de PAT nos 4
        # repos de app nem trocar :latest por tag imutável. Configuração por
        # app fica só em annotation, no application.yaml de cada um.
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
