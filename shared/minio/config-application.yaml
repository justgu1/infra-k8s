apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: minio-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  project: default

  source:
    # Bucket público (servido direto via IngressRoute /cdn, sem passar pelo app) precisa de
    # policy de download anônimo -- fora do schema de `provisioning.buckets` do chart bitnami.
    repoURL: https://github.com/justgu1/infra-k8s.git
    targetRevision: main
    path: shared/minio/config

  destination:
    server: https://kubernetes.default.svc
    namespace: shared

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
