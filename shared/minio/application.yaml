apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: minio
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  project: default

  source:
    # OCI, sem prefixo "oci://" (charts.bitnami.com clássico descontinuado)
    repoURL: registry-1.docker.io/bitnamicharts
    chart: minio
    targetRevision: 17.0.21

    helm:
      values: |
        # bitnami/* aponta pro catálogo pago desde set/2025
        image:
          repository: bitnamilegacy/minio
        clientImage:
          repository: bitnamilegacy/minio-client
        console:
          image:
            repository: bitnamilegacy/minio-object-browser
        defaultInitContainers:
          volumePermissions:
            image:
              repository: bitnamilegacy/os-shell

        mode: standalone

        auth:
          existingSecret: minio-credentials

        persistence:
          enabled: true
          size: 20Gi

        # 1 bucket + policy + user por projeto, isolado no próprio bucket
        provisioning:
          enabled: true

          buckets:
            - name: hericarealtor
              region: us-east-1
              versioning: false
            - name: tyershop
              region: us-east-1
              versioning: false
            - name: loki
              region: us-east-1
              versioning: false
            - name: tempo
              region: us-east-1
              versioning: false
            - name: autoschedule
              region: us-east-1
              versioning: false

          policies:
            - name: hericarealtor-rw
              statements:
                - resources:
                    - "arn:aws:s3:::hericarealtor"
                    - "arn:aws:s3:::hericarealtor/*"
                  actions:
                    - "s3:*"
                  effect: Allow
            - name: tyershop-rw
              statements:
                - resources:
                    - "arn:aws:s3:::tyershop"
                    - "arn:aws:s3:::tyershop/*"
                  actions:
                    - "s3:*"
                  effect: Allow
            - name: loki-rw
              statements:
                - resources:
                    - "arn:aws:s3:::loki"
                    - "arn:aws:s3:::loki/*"
                  actions:
                    - "s3:*"
                  effect: Allow
            - name: tempo-rw
              statements:
                - resources:
                    - "arn:aws:s3:::tempo"
                    - "arn:aws:s3:::tempo/*"
                  actions:
                    - "s3:*"
                  effect: Allow
            - name: autoschedule-rw
              statements:
                - resources:
                    - "arn:aws:s3:::autoschedule"
                    - "arn:aws:s3:::autoschedule/*"
                  actions:
                    - "s3:*"
                  effect: Allow

          users: []

          # cada key é 1 usuário (username=/password=/policies=), formato exigido pelo chart
          usersExistingSecrets:
            - minio-app-users

  destination:
    server: https://kubernetes.default.svc
    namespace: shared

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
