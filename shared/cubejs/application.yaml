apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cubejs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  project: default

  source:
    # sem chart Helm estável, manifests raw (mesmo padrão do metallb-config)
    repoURL: https://github.com/justgu1/infra-k8s.git
    targetRevision: main
    path: shared/cubejs/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: shared

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
