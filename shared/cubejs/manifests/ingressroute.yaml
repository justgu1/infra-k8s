apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cubejs
  namespace: shared
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`cube.justgui.dev`)
      kind: Rule
      middlewares:
        - name: redirect-websecure
      services:
        - name: cubejs
          port: 4000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cubejs-tls
  namespace: shared
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`cube.justgui.dev`)
      kind: Rule
      services:
        - name: cubejs
          port: 4000
  tls:
    certResolver: letsencrypt
