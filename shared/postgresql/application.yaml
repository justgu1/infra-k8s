apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: postgresql
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  project: default

  source:
    repoURL: registry-1.docker.io/bitnamicharts
    chart: postgresql
    targetRevision: 18.8.12

    helm:
      values: |
        image:
          repository: bitnamilegacy/postgresql

        auth:
          existingSecret: postgresql-credentials
          username: app
          database: app_shared

        primary:
          persistence:
            enabled: true
            size: 20Gi

          # O preset padrão do chart ("nano": 150m de CPU e 192Mi de memória) é pequeno demais para um banco compartilhado:
          # com poucas dezenas de conexões ativas o contêiner estoura a memória (OOMKilled), reinicia em loop e derruba
          # todos os apps ao mesmo tempo; com a CPU limitada a 150m, qualquer pico vira fila de conexões.
          resourcesPreset: none
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi

          # shared_buffers acompanha a memória nova (o padrão de 128MB não cabia nos 192Mi anteriores).
          extendedConfiguration: |
            shared_buffers = 256MB
            max_connections = 150
            work_mem = 4MB

          # Unificado: tabela com tenant_id + RLS (`USING (tenant_id = current_setting('app.tenant_id')::uuid)`),
          # sessão faz `SET app.tenant_id` antes da query. Separado: `CREATE DATABASE project_x OWNER app;` sob demanda.
          initdb:
            scripts:
              01-rls-role.sql: |
                CREATE ROLE app_rw NOLOGIN NOSUPERUSER NOBYPASSRLS;
                GRANT app_rw TO app;

  destination:
    server: https://kubernetes.default.svc
    namespace: shared

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
