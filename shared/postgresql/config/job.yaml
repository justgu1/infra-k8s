apiVersion: batch/v1
kind: Job
metadata:
  name: postgresql-provision-apps
  namespace: shared
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: provision
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: postgres-password
          command:
            - sh
            - -c
            - |
              set -eu
              until pg_isready -h postgresql -U postgres >/dev/null 2>&1; do
                sleep 2
              done
              for f in /app-passwords/*; do
                db=$(basename "$f")
                pass=$(cat "$f")
                # db/pass só têm [A-Za-z0-9] (gerados via openssl+tr), seguro interpolar direto
                psql -h postgresql -U postgres -v ON_ERROR_STOP=1 <<SQL
                  DO \$\$
                  BEGIN
                    IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '${db}') THEN
                      EXECUTE format('CREATE ROLE %I LOGIN PASSWORD %L', '${db}', '${pass}');
                    ELSE
                      EXECUTE format('ALTER ROLE %I WITH PASSWORD %L', '${db}', '${pass}');
                    END IF;
                  END
                  \$\$;
              SQL
                # CREATEROLE -- deixa cada app criar um role restrito próprio dentro do seu
                # banco (ex: autoschedule_app com NOSUPERUSER NOBYPASSRLS via migration), sem
                # precisar de acesso ao superuser do cluster pra isso.
                psql -h postgresql -U postgres -v ON_ERROR_STOP=1 \
                  -c "ALTER ROLE \"${db}\" CREATEROLE"
                psql -h postgresql -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='${db}'" | grep -q 1 || \
                  psql -h postgresql -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"${db}\" OWNER \"${db}\""
              done
          volumeMounts:
            - name: app-passwords
              mountPath: /app-passwords
              readOnly: true
      volumes:
        - name: app-passwords
          secret:
            secretName: postgresql-app-passwords
