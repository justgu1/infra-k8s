apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  project: default

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: 1.24.4

    helm:
      values: |
        # monolítico + disco local; storage S3 fica pra fase 2
        traces:
          otlp:
            grpc:
              enabled: true
            http:
              enabled: true

        tempo:
          retention: 168h # 7d, bate com o ram<=7d do diagrama

        persistence:
          enabled: true
          size: 10Gi

        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 512Mi

        serviceMonitor:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: telemetry

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
