# BasicAuth unificado (szguisantos@gmail.com) pras UIs de telemetria sem
# login próprio (Prometheus e Alertmanager não têm auth nativa).
# Secret selado em ./sealed-secret-infra-basicauth.yaml, chave "users"
# (formato htpasswd, bcrypt).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: infra-basicauth
  namespace: telemetry
spec:
  basicAuth:
    secret: infra-basicauth

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prometheus-tls
  namespace: telemetry
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`prometheus.justgui.dev`)
      kind: Rule
      middlewares:
        - name: infra-basicauth
      services:
        - name: kube-prometheus-stack-prometheus
          port: 9090
  tls:
    certResolver: letsencrypt

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: alertmanager-tls
  namespace: telemetry
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`alertmanager.justgui.dev`)
      kind: Rule
      middlewares:
        - name: infra-basicauth
      services:
        - name: kube-prometheus-stack-alertmanager
          port: 9093
  tls:
    certResolver: letsencrypt
