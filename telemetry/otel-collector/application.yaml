apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: otel-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  project: default

  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.171.0

    helm:
      values: |
        mode: deployment
        replicaCount: 1

        # distro "core" do chart não tem os exporters que usamos (prometheusremotewrite, loki)
        image:
          repository: otel/opentelemetry-collector-contrib

        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi

        ports:
          otlp:
            enabled: true
          otlp-http:
            enabled: true
          jaeger-compact:
            enabled: false
          jaeger-thrift:
            enabled: false
          jaeger-grpc:
            enabled: false
          zipkin:
            enabled: false

        config:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: 0.0.0.0:4317
                http:
                  endpoint: 0.0.0.0:4318

          processors:
            batch: {}
            memory_limiter:
              check_interval: 5s
              limit_percentage: 80
              spike_limit_percentage: 25

          exporters:
            otlp/tempo:
              endpoint: tempo.telemetry.svc.cluster.local:4317
              tls:
                insecure: true
            prometheusremotewrite:
              endpoint: http://kube-prometheus-stack-prometheus.telemetry.svc.cluster.local:9090/api/v1/write
            otlphttp/loki:
              endpoint: http://loki-gateway.telemetry.svc.cluster.local/otlp

          service:
            pipelines:
              traces:
                receivers: [otlp]
                processors: [memory_limiter, batch]
                exporters: [otlp/tempo]
              metrics:
                receivers: [otlp]
                processors: [memory_limiter, batch]
                exporters: [prometheusremotewrite]
              logs:
                receivers: [otlp]
                processors: [memory_limiter, batch]
                exporters: [otlphttp/loki]

  destination:
    server: https://kubernetes.default.svc
    namespace: telemetry

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
