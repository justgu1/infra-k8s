apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.6.0

    helm:
      values: |
        # Prometheus + Alertmanager + Grafana + kube-state-metrics + node-exporter

        # k3s não expõe kube-scheduler/controller-manager/etcd/proxy nos ports padrão
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false

        prometheus:
          prometheusSpec:
            retention: 7d
            retentionSize: "8GB"
            # otel-collector manda métricas via remote-write
            enableRemoteWriteReceiver: true
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi

        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 128Mi
            storage:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 1Gi

        grafana:
          admin:
            existingSecret: grafana-admin-credentials
            userKey: admin-user
            passwordKey: admin-password
          persistence:
            enabled: true
            size: 2Gi
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          # datasource de prometheus o chart já cria sozinho
          additionalDataSources:
            - name: Loki
              type: loki
              access: proxy
              url: http://loki-gateway.telemetry.svc.cluster.local
            - name: Tempo
              # o service do tempo expõe o http de query na 3200 (3100 não existe)
              access: proxy
              url: http://tempo.telemetry.svc.cluster.local:3200

          # link do email de reset aponta pro dominio publico
          grafana.ini:
            server:
              root_url: https://grafana.justgui.dev
            smtp:
              enabled: true
              host: smtp.hostinger.com:465
              user: support@justgui.dev
              from_address: support@justgui.dev
              from_name: Grafana

          # senha SMTP fora do ConfigMap (vem do secret selado)
          env:
            - name: GF_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-smtp-credentials
                  key: password

        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: telemetry

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
