apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com'
    targetRevision: HEAD
    path: argocd-apps
  destination:
    server: 'https://default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
