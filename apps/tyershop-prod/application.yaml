apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: tyershop-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"

# Sem argocd-image-updater: produção só muda quando a tag em k8s/prod/kustomization.yaml muda.
spec:
  project: default

  source:
    repoURL: https://github.com/justgu1/tyershop.git
    targetRevision: main
    path: k8s/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: tyershop-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
