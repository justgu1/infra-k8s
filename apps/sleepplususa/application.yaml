apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: sleepplususa
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd-image-updater.argoproj.io/image-list: wordpress=ghcr.io/justgu1/sleepplususa
    argocd-image-updater.argoproj.io/wordpress.update-strategy: digest

spec:
  project: default

  source:
    repoURL: https://github.com/justgu1/sleepplususa.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: apps

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
